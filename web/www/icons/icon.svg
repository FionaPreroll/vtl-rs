<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app's icon, full bleed for masks: the front panel's blue, its grey
       body with three lights, and VTL. The PNGs beside it are made from it. -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2858b8"/>
      <stop offset="1" stop-color="#1d3f8f"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdbd4"/>
      <stop offset="1" stop-color="#bdbcb4"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffd8c4"/>
      <stop offset="0.45" stop-color="#ff3218"/>
      <stop offset="1" stop-color="#b81000"/>
    </radialGradient>
    <radialGradient id="dark" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#7a2620"/>
      <stop offset="1" stop-color="#3c0d0a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#blue)"/>
  <rect y="318" width="512" height="194" fill="url(#grey)"/>
  <rect y="312" width="512" height="10" fill="#0f2457"/>
  <text x="256" y="262" fill="#f4f3ee" font-family="Helvetica Neue, Arial, Liberation Sans, sans-serif"
        font-size="150" font-style="italic" font-weight="800" text-anchor="middle" letter-spacing="4">VTL</text>
  <g stroke="#2a2a2a" stroke-width="5">
    <circle cx="176" cy="392" r="26" fill="url(#lit)"/>
    <circle cx="256" cy="392" r="26" fill="url(#dark)"/>
    <circle cx="336" cy="392" r="26" fill="url(#lit)"/>
  </g>
</svg>
