[package]
name = "vtl-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Fiona <fipreroll+app@gmail.com>"]
repository = "https://github.com/FionaPreroll/vtl-rs"
description = "Very Tiny Language (VTL-2) in Rust, inspired by the historical VTL-2 on the Altair 680b and others."
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["vtl", "interpreter", "altair", "retro", "language"]
categories = ["command-line-utilities", "emulators"]
build = "build.rs"

[workspace]
members = [".", "web"]

[lib]
name = "vtl_rs"
path = "src/lib.rs"

[[bin]]
name = "vtl-rs"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line program: line editing with history, and Ctrl-C.
cli = ["dep:rustyline", "dep:ctrlc"]

[dependencies]
ctrlc = { version = "3.4", optional = true }
rustyline = { version = "19.0.0", optional = true, default-features = false, features = ["with-file-history"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
