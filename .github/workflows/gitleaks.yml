name: gitleaks
# Every commit of a pull request, and what lands on main. Pushes to other
# branches are checked with their pull request. Nothing runs on a schedule:
# the history does not change, and gitleaks only finds something new in it
# with a new version, which comes with an update of the action.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # It reads the commits, of a pull request too, and changes nothing.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The version of gitleaks is the one the action names at this commit, so
      # Dependabot raises it with the action. The job can only read, so a bad
      # download could at worst miss a secret.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # For the list of a pull request's commits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token may not comment; a finding fails the check instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
